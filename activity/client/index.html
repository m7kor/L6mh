<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>راديو وحيد عمر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
        background: #0a0a0a;
        color: #e0e0e0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        -webkit-text-size-adjust: 100%;
      }
      #root { width: 100%; height: 100%; }

      /* ── Activity Responsive ── */
      @media (max-width: 600px) {
        .activity-header { padding: 8px 12px !important; }
        .activity-header-title { font-size: 14px !important; }
        .activity-header-username { font-size: 11px !important; }
        .activity-header-avatar { width: 24px !important; height: 24px !important; }
        .activity-player { max-width: 100% !important; padding: 0 12px !important; }
      }
      @media (max-width: 400px) {
        .activity-header-title { font-size: 12px !important; }
        .activity-player { max-width: 100% !important; padding: 0 8px !important; }
      }
      @media (min-width: 1200px) {
        .activity-content { max-width: 1100px !important; }
        .activity-player { max-width: 1000px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
