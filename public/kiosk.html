<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>راديو وحيد عمر — Kiosk</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/effects.css">
  <style>
    body{background:#000;color:#fff;font-family:var(--font-ar);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;overflow:hidden}

    /* ── Animated Background ── */
    .bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
    .bg-layer::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(233,184,110,0.10),transparent 70%);top:-15%;right:-10%;animation:bgOrb1 15s ease-in-out infinite alternate;filter:blur(40px)}
    .bg-layer::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,0.08),transparent 70%);bottom:-15%;left:-10%;animation:bgOrb2 18s ease-in-out infinite alternate;filter:blur(40px)}
    @keyframes bgOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,30px) scale(1.15)}100%{transform:translate(30px,-20px) scale(0.9)}}
    @keyframes bgOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.1)}100%{transform:translate(-20px,20px) scale(0.95)}}

    /* ── Main Content ── */
    .kiosk{position:relative;z-index:1;text-align:center;max-width:900px;width:90vw}

    .kiosk-live{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px}
    .kiosk-live-dot{width:10px;height:10px;border-radius:50%;background:var(--onair,#E9B86E);animation:pulse 2s infinite;box-shadow:0 0 12px rgba(233,184,110,0.5)}
    .kiosk-live-dot.off{background:#555;animation:none;box-shadow:none}
    .kiosk-live-text{font-size:13px;color:var(--text-2);font-family:var(--font-en);text-transform:uppercase;letter-spacing:2px;font-weight:700}

    .kiosk-title{font-size:14px;color:var(--cyan);font-family:var(--font-en);text-transform:uppercase;letter-spacing:3px;margin-bottom:12px;font-weight:800}
    .kiosk-now{font-size:42px;font-weight:900;line-height:1.6;margin-bottom:32px;min-height:56px;background:linear-gradient(135deg,#fff 30%,var(--cyan) 70%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;background-size:200% auto;animation:textShine 5s linear infinite}
    body[data-state="idle"] .kiosk-now,body[data-state="stopped"] .kiosk-now,body[data-state="unknown"] .kiosk-now{animation:none;-webkit-text-fill-color:var(--text-2);background:none}
    @keyframes textShine{0%{background-position:0% center}100%{background-position:200% center}}

    /* ── Waveform ── */
    .kiosk-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:48px;margin-bottom:32px}
    .kiosk-wave .bar{width:4px;background:var(--cyan);border-radius:2px;animation:waveform 1.2s ease-in-out infinite;transform-origin:bottom}
    .kiosk-wave .bar:nth-child(1){height:35%;animation-delay:0s}
    .kiosk-wave .bar:nth-child(2){height:65%;animation-delay:.1s}
    .kiosk-wave .bar:nth-child(3){height:100%;animation-delay:.2s}
    .kiosk-wave .bar:nth-child(4){height:55%;animation-delay:.15s}
    .kiosk-wave .bar:nth-child(5){height:80%;animation-delay:.05s}
    .kiosk-wave .bar:nth-child(6){height:40%;animation-delay:.25s}
    .kiosk-wave .bar:nth-child(7){height:70%;animation-delay:.12s}
    .kiosk-wave .bar:nth-child(8){height:90%;animation-delay:.08s}
    .kiosk-wave .bar:nth-child(9){height:50%;animation-delay:.18s}
    .kiosk-wave.off .bar{animation-play-state:paused;transform:scaleY(0.12);opacity:0.25}
    @keyframes waveform{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

    /* ── Stats ── */
    .kiosk-stats{display:flex;justify-content:center;gap:64px;margin-top:32px}
    .kiosk-stat{text-align:center}
    .kiosk-stat-num{font-family:var(--font-en);font-size:56px;font-weight:900;color:var(--cyan);font-variant-numeric:tabular-nums;line-height:1}
    .kiosk-stat-lbl{font-size:13px;color:var(--text-3);margin-top:8px;text-transform:uppercase;letter-spacing:1px;font-weight:600}

    /* ── Time ── */
    .kiosk-time{font-family:var(--font-en);font-size:14px;color:var(--text-3);margin-top:40px;font-weight:600}

    /* ── Footer ── */
    .kiosk-footer{font-size:11px;color:var(--text-3);margin-top:24px;letter-spacing:0.5px}
    .kiosk-sync{font-family:var(--font-en);font-size:11px;color:var(--text-3);margin-top:8px;min-height:14px}

    /* ── Jingle Flash ── */
    #kioskFlash{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0;transition:opacity .15s}
    #kioskFlash.active{opacity:1}
    #kioskFlash.latma{background:radial-gradient(circle at center,rgba(255,107,53,0.3) 0%,transparent 50%)}
    #kioskFlash.basmala{background:radial-gradient(circle at center,rgba(168,85,247,0.3) 0%,transparent 50%)}
    #kioskFlash.general{background:radial-gradient(circle at center,rgba(233,184,110,0.25) 0%,transparent 50%)}

    /* ── Responsive ── */
    @media(max-width:768px){
      .kiosk{width:95vw}
      .kiosk-now{font-size:32px;line-height:1.4}
      .kiosk-stats{gap:40px}
      .kiosk-stat-num{font-size:44px}
      .kiosk-wave{height:40px;gap:3px}
    }
    @media(max-width:480px){
      .kiosk{width:92vw}
      .kiosk-title{font-size:12px;letter-spacing:2px}
      .kiosk-now{font-size:24px;line-height:1.5;margin-bottom:24px}
      .kiosk-wave{height:32px;gap:2px;margin-bottom:24px}
      .kiosk-wave .bar{width:3px}
      .kiosk-stats{gap:24px;margin-top:24px}
      .kiosk-stat-num{font-size:36px}
      .kiosk-stat-lbl{font-size:11px}
      .kiosk-live-text{font-size:11px;letter-spacing:1px}
      .kiosk-time{font-size:12px;margin-top:24px}
      .kiosk-footer{font-size:9px;margin-top:16px}
    }
    @media(max-width:360px){
      .kiosk-now{font-size:20px}
      .kiosk-stats{gap:16px}
      .kiosk-stat-num{font-size:30px}
      .kiosk-wave{height:28px}
    }
    /* ── Landscape ── */
    @media(max-height:500px)and(orientation:landscape){
      .kiosk-now{font-size:24px;margin-bottom:16px}
      .kiosk-wave{height:28px;margin-bottom:16px}
      .kiosk-stats{gap:32px;margin-top:16px}
      .kiosk-stat-num{font-size:36px}
    }
    /* ── Large screens ── */
    @media(min-width:1200px){
      .kiosk-now{font-size:52px}
      .kiosk-stat-num{font-size:64px}
      .kiosk-wave{height:56px}
    }
    @media (prefers-reduced-motion: reduce){
      .bg-layer,.bg-layer::before,.bg-layer::after{display:none}
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important}
    }
  </style>
</head>
<body data-state="loading">

<!-- Animated Background -->
<div class="bg-layer"></div>

<!-- Jingle Flash -->
<div id="kioskFlash"></div>

<div class="kiosk">
  <div class="kiosk-live">
    <div class="kiosk-live-dot off" id="liveDot"></div>
    <div class="kiosk-live-text" id="liveText">جاري الاتصال…</div>
  </div>

  <div class="kiosk-title">🎙️ راديو وحيد عمر</div>

  <div class="kiosk-now" id="nowTitle">جاري التحميل...</div>

  <!-- Waveform -->
  <div class="kiosk-wave off" id="kioskWave">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>

  <div class="kiosk-stats">
    <div class="kiosk-stat">
      <div class="kiosk-stat-num" id="statPlays">0</div>
      <div class="kiosk-stat-lbl">مرة شُغّل</div>
    </div>
    <div class="kiosk-stat">
      <div class="kiosk-stat-num" id="statUptime">0</div>
      <div class="kiosk-stat-lbl">تشغيل العملية</div>
    </div>
    <div class="kiosk-stat">
      <div class="kiosk-stat-num" id="statVideos">0</div>
      <div class="kiosk-stat-lbl">مقطع</div>
    </div>
  </div>

  <div class="kiosk-time" id="kioskTime"></div>
  <div class="kiosk-footer">بث مباشر 24/7 — مقاطع عشوائية من قناة وحيد عمر</div>
  <div class="kiosk-sync" id="kioskSync"></div>
</div>

<script type="module">
import { startLiveUpdates } from '/js/live-updates.js';
import { createKioskView, checkKioskJingles } from '/js/kiosk-view.js';

const view = createKioskView(document);
const jingleState = { since: 0 };
let lastUpdated = null;

async function refresh(signal) {
  const r = await fetch('/api/public', { signal, cache: 'no-store' });
  if (!r.ok) throw new Error('kiosk status unavailable: ' + r.status);
  view.apply(await r.json());
  document.getElementById('kioskTime').textContent = new Date().toLocaleString('ar-SA');
}

const updates = startLiveUpdates({
  refresh: async signal => {
    await refresh(signal);
    // Secondary concern: jingle polling must never flip the primary connection
    // state to "unknown" — a missing or failing jingle checker is logged, not fatal.
    if (typeof checkKioskJingles === 'function') {
      try {
        await checkKioskJingles(document, fetch, jingleState);
      } catch (err) {
        console.debug('kiosk jingle check skipped:', err && err.message);
      }
    }
    lastUpdated = new Date();
    const sync = document.getElementById('kioskSync');
    if (sync) sync.textContent = 'آخر تحديث: ' + lastUpdated.toLocaleTimeString('ar');
  },
  onConnectionChange(connected) {
    if (!connected) view.markUnknown(lastUpdated);
  },
});
window.addEventListener('pagehide', () => updates.stop(), { once: true });
window.addEventListener('pageshow', event => { if (event.persisted) location.reload(); });
</script>
</body>
</html>
